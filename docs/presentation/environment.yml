# AGIRH - Écosystème de génération de présentation PFA
# ------------------------------------------------------------------
# DECISION (GO 1 v2) : AUCUN nouvel environnement n'est créé.
# On travaille dans l'environnement Conda **base**
#   C:\ProgramData\anaconda3\python.exe  (Python 3.13.5)
# dont les dépendances sont déjà installées :
