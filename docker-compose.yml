name: agirh

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - agirh-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - agirh-qdrant-data:/qdrant/storage

  # Pas de service Ollama conteneurise ici (decision du porteur du projet, 2026-08-15) : Ollama
  # tourne nativement sur la machine hote (deja installe, deja utilise en dev). L'Api le joint
  # via host.docker.internal, le nom special que Docker Desktop resout vers l'hote depuis un
  # conteneur. extra_hosts sur l'api n'est utile que sous Docker Engine Linux sans Docker Desktop
  # (host.docker.internal n'y est pas resolu nativement) - sans effet ici, juste pour la
  # portabilite. Le porteur du projet a aussi acces a un second Ollama, distant, sur le reseau de
  # son entreprise (modeles differents et plus capables) - voir Ollama:RouterModele /
  # Ollama:GeneratorModele (appsettings.json / appsettings.Entreprise.json.example) pour basculer
  # entre les deux profils sans recompiler ; ce compose reste sur le profil local par defaut.

  api:
    build:
      context: .
      dockerfile: src/Agirh.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__AgirhDb: "Server=sqlserver,1433;Database=AgirhDb;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Issuer: Agirh
      Jwt__Audience: Agirh.Clients
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__TokenLifetimeMinutes: "60"
      Ollama__BaseUrl: "http://host.docker.internal:11434"
      Qdrant__Host: "qdrant"
    ports:
      - "5080:8080"
    volumes:
      # rag/models/ (~850 Mo, telecharge via .claude/scripts/download-models.ps1) et rag/corpus/
      # montes en lecture seule depuis l'hote plutot que copies dans l'image (voir Dockerfile).
      - ./rag/models:/app/rag/models:ro
      - ./rag/corpus:/app/rag/corpus:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    environment:
      AGIRH_API_URL: "http://api:8080"
    ports:
      - "3000:3000"

volumes:
  agirh-sql-data:
  agirh-qdrant-data:
